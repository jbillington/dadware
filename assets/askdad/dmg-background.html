<!DOCTYPE html>
<!--
  Source for the DMG window background (600x320 points). Rendered to
  dmg-background.tiff by scripts/build_app_art.sh; edit this, then rerun it.
  Icon positions are set in make_dmg.sh and must match the arrow here:
  Ask Dad.app at (150, 165), Applications at (450, 165).
  Keep what matters above y=270: a Finder with the tab bar or path bar turned on
  shows less of the window than the 320 points it is drawn for.
-->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Saira; font-weight: 900; font-style: italic;
  src: url(../../site/fonts/saira-black-italic.woff2) format("woff2"); }
@font-face { font-family: Atkinson; font-weight: 400;
  src: url(../../site/fonts/atkinson-regular.woff2) format("woff2"); }
html, body { margin: 0; padding: 0; }
body { width: 600px; height: 320px; background: #f5eedb; position: relative;
  overflow: hidden; color: #1d1a16; }
h1 { position: absolute; top: 26px; left: 0; right: 0; margin: 0; text-align: center;
  font: italic 900 30px/1 Saira, sans-serif; letter-spacing: 0.3px; }
p { position: absolute; top: 66px; left: 0; right: 0; margin: 0; text-align: center;
  font: 400 15px/1.3 Atkinson, sans-serif; color: #5c554a; }
svg.arrow { position: absolute; left: 222px; top: 140px; }
.stripes { position: absolute; left: 0; right: 0; bottom: 0; }
.stripes div { height: 5px; }
</style></head><body>
<h1>Drag Ask Dad into Applications.</h1>
<p>Then open it from there. That's it, kiddo.</p>
<svg class="arrow" width="156" height="50" viewBox="0 0 156 50">
  <path d="M0 17 H112 V0 L156 25 L112 50 V33 H0 Z" fill="#c8102e"/>
</svg>
<div class="stripes">
  <div style="background:#f7b801"></div><div style="background:#f18701"></div>
  <div style="background:#e0301e"></div><div style="background:#7a1fa2"></div>
</div>
</body></html>
