name: Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Install test dependencies if requirements-dev.txt exists
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-cov pytest-mock
          fi
      
      - name: Run tests
        run: |
          # Run tests if tests/ directory exists
          if [ -d tests ]; then
            pytest tests/ -v --cov=. --cov-report=term-missing || echo "Tests directory exists but no tests yet"
          else
            echo "No tests directory yet - skipping tests"
          fi
      
      - name: Test CLI basic commands
        run: |
          python3 yourdad.py --version
          python3 yourdad.py --help
          # Test that commands don't crash (may need permissions for full scan)
          python3 yourdad.py cpu --terminal || echo "CPU scan may need permissions"
      
      - name: Check code quality
        run: |
          # Basic syntax check
          python3 -m py_compile yourdad.py || true
          python3 -m py_compile scanners/*.py || true
          python3 -m py_compile renderers/*.py || true
          python3 -m py_compile utils/*.py || true

  build:
    name: Build Executable
    runs-on: macos-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
      
      - name: Build executable
        run: |
          chmod +x build_executable.sh
          ./build_executable.sh
      
      - name: Test executable
        run: |
          ./dist/yourdad --version
          ./dist/yourdad --help
          # Test executable works (may need permissions for full scan)
          ./dist/yourdad cpu --terminal || echo "Executable scan may need permissions"
      
      - name: Get executable info
        run: |
          ls -lh dist/yourdad
          file dist/yourdad
          ./dist/yourdad --version
      
      - name: Upload executable artifact
        uses: actions/upload-artifact@v3
        with:
          name: yourdad-executable-macos
          path: dist/yourdad
          retention-days: 30
      
      - name: Create release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Create zip with executable and README
          mkdir -p release
          cp dist/yourdad release/
          cp README.md release/
          cp BUILD-EXECUTABLE.md release/
          zip -r yourdad-macos.zip release/
      
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v3
        with:
          name: yourdad-macos-release
          path: yourdad-macos.zip

