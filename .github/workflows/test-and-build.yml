name: Test and Build

on:
  push:
    branches: [ main, develop, 'refactor/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    name: Tests (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the compatibility floor the runtime code targets.
          # It is only available on the Intel runners.
          - os: macos-13
            python-version: '3.9'
          # A current interpreter, so we notice breakage on modern Python too.
          - os: macos-latest
            python-version: '3.12'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # This project's dependency file is requirements-dev.txt. Without
          # this, setup-python looks only for requirements.txt/pyproject.toml,
          # finds neither, and fails the job before any test runs.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=term-missing

      - name: Test CLI basic commands
        run: |
          set -e
          python3 yourdad.py --version
          python3 yourdad.py --help
          # NOTE: --terminal and --no-color are top-level flags and MUST come
          # before the subcommand. `yourdad.py cpu --terminal` is an argparse
          # error, not a valid invocation.
          python3 yourdad.py --terminal --no-color cpu

      - name: Verify the runtime stays importable on the 3.9 floor
        if: matrix.python-version == '3.9'
        run: |
          # Annotations are evaluated at import time, so this catches any
          # `X | None` that slipped into a signature.
          python3 -c "
          import scanners.storage, scanners.cpu, scanners.grading, scanners.models
          import scanners.mac_libraries, scanners.hidden_storage, scanners.snapshots
          import renderers.html, renderers.terminal
          import personality.yourdad, utils.path_utils, utils.version
          import utils.volumes, utils.llm_prompt, yourdad
          print('runtime imports clean')
          "

  build:
    name: Build universal2 executable
    runs-on: macos-13
    needs: test
    # Deliberately does NOT run on ordinary pushes. The universal2 build,
    # packaging and signing path is not ready to be exercised yet, so it runs
    # only when a release is tagged or when it is triggered by hand from the
    # Actions tab. To re-enable it on every push to main, delete this `if`.
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build number is derived from git history

      # PyInstaller cannot cross-compile: a universal2 binary requires the
      # *building* interpreter to itself be universal2. GitHub's hosted
      # Pythons are single-architecture, so install python.org's universal2
      # framework build instead of using actions/setup-python here.
      - name: Install universal2 Python
        env:
          PY_VERSION: 3.12.8
        run: |
          set -e
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          echo "PYTHON=$PY" >> "$GITHUB_ENV"
          # Fail loudly if this is somehow not a fat binary, rather than
          # silently producing a thin executable later.
          lipo -info "$(${PY} -c 'import sys; print(sys.executable)')"

      - name: Install PyInstaller
        run: |
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install 'pyinstaller>=6.0'

      - name: Build executable
        env:
          DADWARE_TARGET_ARCH: universal2
        run: |
          set -e
          # build_executable.sh discovers pyinstaller via `pyinstaller` or
          # `python3 -m PyInstaller`, so put the universal2 interpreter first.
          export PATH="$(dirname "$PYTHON"):$PATH"
          chmod +x build_executable.sh
          ./build_executable.sh

      - name: Verify the binary is genuinely universal2
        run: |
          set -e
          file dist/yourdad
          lipo -info dist/yourdad
          # Hard assertion: a silently-thin binary must fail the build rather
          # than being published as "universal".
          for arch in x86_64 arm64; do
            if ! lipo -info dist/yourdad | grep -q "$arch"; then
              echo "::error::dist/yourdad is missing the $arch slice"
              exit 1
            fi
          done
          echo "universal2 confirmed: both slices present"

      - name: Test executable
        run: |
          set -e
          ./dist/yourdad --version
          ./dist/yourdad --help
          # Top-level flags precede the subcommand. No `|| echo` here - if the
          # executable cannot complete a scan, that is a build failure.
          ./dist/yourdad --terminal --no-color cpu
          # A bounded storage scan, to exercise the scanner in the frozen app.
          ./dist/yourdad --terminal --no-color --volume "$HOME" --no-mac-libraries --top 5

      - name: Report build metadata
        run: |
          ls -lh dist/yourdad
          ./dist/yourdad --version
          # The frozen app has no .git, so this proves the build stamp baked in.
          ./dist/yourdad --terminal --no-color --volume "$HOME" --no-mac-libraries --top 1 | sed -n '1,4p'

      # Signing and notarization run only when the secrets are configured, so
      # forks and ordinary PRs still get a working unsigned artifact.
      - name: Sign and notarize
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DADWARE_CODESIGN_IDENTITY: ${{ secrets.DADWARE_CODESIGN_IDENTITY }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -e
          # Skip cleanly when signing secrets are not configured (forks, or
          # before a Developer ID is set up), rather than failing the release.
          if [ -z "$DADWARE_CODESIGN_IDENTITY" ] || [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "::warning::Signing secrets not configured - publishing an UNSIGNED binary."
            echo "Users will see a Gatekeeper warning. See docs/BUILDING.md."
            exit 0
          fi

          # Import the signing certificate into a temporary keychain.
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f /tmp/cert.p12

          # App Store Connect API key for notarytool.
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8
          export APPLE_API_KEY_PATH=/tmp/AuthKey.p8

          chmod +x sign_and_notarize.sh
          ./sign_and_notarize.sh
          rm -f /tmp/AuthKey.p8

      - name: Package for distribution
        run: |
          chmod +x package_for_distribution.sh
          ./package_for_distribution.sh

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: yourdad-macos-universal2
          path: dist/yourdad
          retention-days: 30

      - name: Upload distribution package
        uses: actions/upload-artifact@v4
        with:
          name: yourdad-distribution-zip
          path: yourdad-*.zip
          retention-days: 30
          if-no-files-found: error
